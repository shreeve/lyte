# /etc/lyte/lyte-host.conf — the host service's one knob file
# (EnvironmentFile for lyte-host.service; installer seeds it, edits
# survive reinstalls).

# LYTE_HOST_ARGS: the session posture. This is the standing-loop
# command line, verbatim (--backend/--encoder/--ratchet are accepted
# no-ops since E5; --seconds bounds one leg — systemd respawns).
LYTE_HOST_ARGS=--backend direct --encoder native --wire-listen 41151 --ratchet --clipboard=images --advertise-interface CHANGE_ME --seconds 7200
