# /etc/lyte/lyte-host.conf — the host service's one knob file
# (EnvironmentFile for lyte-host.service; installer seeds it, edits
# survive reinstalls).

# LYTE_HOST_ARGS: the session posture. Without --seconds a --wire-listen
# host is the service: it serves sessions in turn inside one process with
# no session clock. Adding --seconds N makes each run one session bounded
# to N s, after which systemd respawns it (the pre-loop posture).
LYTE_HOST_ARGS=--wire-listen 41151 --clipboard=images --advertise-interface CHANGE_ME
