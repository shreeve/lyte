# ~/.config/lyte/host.conf — the host service's one knob file (the
# EnvironmentFile of lyte-host.service). install-host.sh seeds it once;
# edits survive reinstalls and deploys. Restart the service after an edit.

# LYTE_HOST_ARGS: the lyte-host command line. Without --seconds a
# --wire-listen host is the service: it serves sessions in turn inside one
# process with no session clock. Adding --seconds N makes each run one
# session bounded to N s, after which systemd respawns it.
LYTE_HOST_ARGS=--wire-listen 41151 --clipboard=images --advertise-interface CHANGE_ME
