<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lyte — browser</title>
  <script type="importmap">
    { "imports": { "@bjorn3/browser_wasi_shim": "./vendor/browser_wasi_shim/index.js" } }
  </script>
  <style>
    body { max-width: 64rem; margin: 0 auto; padding: 1rem; font-family: system-ui, sans-serif; }
    .layout { display: grid; grid-template-columns: minmax(14rem, 18rem) 1fr; gap: 1rem; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
    label { display: block; font-size: 0.8rem; margin: 0.5rem 0 0.2rem; }
    input { width: 100%; box-sizing: border-box; font: inherit; }
    .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    #frame-canvas { display: block; width: 100%; height: auto; max-height: 70vh; object-fit: contain; background: #000; }
    #frame-canvas:focus { outline: 2px solid #2f5d50; }
    #status { font: 700 1.5rem ui-monospace, monospace; margin-bottom: 0.5rem; }
    #status.pass { color: #0b6b2a; }
    #status.fail { color: #9b1c1c; }
    #status.pending { color: #5c5c5c; }
    pre, .session-line { font: 0.78rem/1.45 ui-monospace, monospace; white-space: pre-wrap; }
    pre { max-height: 22rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>Lyte browser proof harness</h1>
  <div class="layout">
    <aside>
      <label for="pin">PIN</label>
      <input id="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="from control peer" />
      <label for="host-key">Host static (hex)</label>
      <input id="host-key" name="host-key" spellcheck="false" placeholder="64 hex chars" />
      <label for="sidecar-url">WebTransport URL</label>
      <input id="sidecar-url" name="sidecar-url" spellcheck="false" placeholder="https://127.0.0.1:…" />
      <div class="actions">
        <button type="button" id="connect" disabled>Connect</button>
        <button type="button" id="rerun" disabled>Re-run proofs</button>
      </div>
      <div class="session-line" id="session-line">Loading WASM…</div>
    </aside>

    <section>
      <div id="status" class="pending">LOADING</div>
      <canvas id="frame-canvas" width="960" height="540" tabindex="0"
        aria-label="Lyte video surface — click to focus for input"></canvas>
      <pre id="log">Instantiating LyteClientBrowser.wasm…</pre>
      <pre id="meta"></pre>
    </section>
  </div>

  <script type="module">
    import { loadControlPeerMeta, loadSidecarMeta } from "./lyte-io.js";
    import { runSessionProof } from "./session-proof.js";
    import { installCanvasInput } from "./interaction.js";

    const $ = (id) => document.getElementById(id);
    const status = $("status");
    const log = $("log");
    const metaEl = $("meta");
    const sessionLine = $("session-line");
    const connectBtn = $("connect");
    const rerunBtn = $("rerun");
    const canvas = $("frame-canvas");
    const pinInput = $("pin");
    const hostKeyInput = $("host-key");
    const sidecarUrlInput = $("sidecar-url");
    // The smoke gate runs headless: audio renders offline there.
    const smoke = new URLSearchParams(location.search).has("smoke");

    let harnessSidecar = null;
    let harnessPeer = null;
    let running = false;
    let activePump = null;
    let activeSink = null;

    // DOM input reaches the live session's carrier; nothing is sent
    // before a session is ready (WASM refuses it softly).
    installCanvasInput(canvas, {
      sendInput: (kind, now, ...args) => {
        const bridge = globalThis.lyteBrowser;
        if (!activePump || !bridge) return;
        activePump.send(bridge.controlSendInput(kind, now, ...args));
      },
      hostSize: () => activeSink?.frameSize || { width: 2048, height: 1280 },
    });

    function setOutcome(passed, lines, extraMeta) {
      status.textContent = passed ? "PASS" : "FAIL";
      status.className = passed ? "pass" : "fail";
      log.textContent = lines;
      if (extraMeta) metaEl.textContent = extraMeta;
      globalThis.lyteSessionPassed = passed;
    }

    function paintSession(peer, clientKey) {
      const st = globalThis.lyteBrowser?.interactionStats?.() || {};
      sessionLine.textContent =
        `peer ${peer.bindHost}:${peer.listenPort}\n` +
        `client ${clientKey || "?"}\n` +
        `input ${st.inputsSent || 0} sent / ${st.inputEchoes || 0} echoes\n` +
        `clipboard ${st.clipboardSent || 0}→${st.clipboardReceived || 0}\n` +
        `audio ${st.audioAssembled || 0} Opus packets`;
    }

    async function runAll({ sidecar, peer, hostStaticPublicKeyHex, pin }) {
      if (running) return;
      running = true;
      connectBtn.disabled = true;
      rerunBtn.disabled = true;
      globalThis.lyteSessionPassed = undefined;
      try {
        if (!globalThis.lyteBrowser) {
          setOutcome(false, "FAIL  browser-proof — lyteBrowser bridge missing");
          return;
        }
        status.textContent = "SESSION…";
        status.className = "pending";
        log.textContent = "Control + Conductor video + interaction organs…";
        const proof = await runSessionProof({
          sidecar,
          hostStaticPublicKeyHex,
          pin,
          canvas,
          offlineAudio: smoke,
          onOpen: (pump, sink) => {
            activePump = pump;
            activeSink = sink;
          },
        });
        paintSession(peer, proof.clientStaticPublicKeyHex);
        setOutcome(
          proof.passed,
          proof.lines,
          `adapter=${sidecar.adapter} url=${sidecar.url}\n` +
            `controlPeer=${peer.bindHost}:${peer.listenPort}\n` + proof.meta
        );
      } catch (error) {
        setOutcome(false, `FAIL  browser-proof — ${error?.message || error}`);
      } finally {
        activePump = null;
        activeSink = null;
        running = false;
        connectBtn.disabled = false;
        rerunBtn.disabled = false;
      }
    }

    /** Connect uses what the form says; Re-run uses the harness values. */
    function formRun() {
      return runAll({
        sidecar: { ...harnessSidecar, url: sidecarUrlInput.value.trim() || harnessSidecar.url },
        peer: harnessPeer,
        hostStaticPublicKeyHex: hostKeyInput.value.trim(),
        pin: pinInput.value.trim(),
      });
    }

    function harnessRun() {
      return runAll({
        sidecar: harnessSidecar,
        peer: harnessPeer,
        hostStaticPublicKeyHex: harnessPeer.hostStaticPublicKeyHex,
        pin: harnessPeer.pin,
      });
    }

    try {
      const { init } = await import("./index.js");
      await init();
      harnessSidecar = await loadSidecarMeta();
      harnessPeer = await loadControlPeerMeta();
      pinInput.value = harnessPeer.pin || "";
      hostKeyInput.value = harnessPeer.hostStaticPublicKeyHex || "";
      sidecarUrlInput.value = harnessSidecar.url || "";
      sessionLine.textContent =
        `Harness ready — peer ${harnessPeer.bindHost}:${harnessPeer.listenPort}\n` +
        `PIN prefilled from control-peer.json`;
      connectBtn.addEventListener("click", formRun);
      rerunBtn.addEventListener("click", harnessRun);
      // The harness auto-runs once; `smoke.mjs --serve` keeps
      // lyte-control-peer serving sessions until it stops.
      await harnessRun();
    } catch (error) {
      setOutcome(false, String(error?.stack || error));
      sessionLine.textContent = "Failed to load harness meta or WASM.";
    }
  </script>
</body>
</html>
