<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lyte</title>
  <script type="importmap">
    { "imports": { "@bjorn3/browser_wasi_shim": "./vendor/browser_wasi_shim/index.js" } }
  </script>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { font: 14px/1.4 system-ui, sans-serif; color: #e8e8e8; }
    #screen {
      position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
      object-fit: contain; background: #000; outline: none; touch-action: none;
    }
    #status {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      max-width: calc(100vw - 32px); padding: 6px 14px; border-radius: 999px;
      background: rgb(20 20 22 / 0.82); box-shadow: 0 2px 12px rgb(0 0 0 / 0.5);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none; transition: opacity 0.4s;
    }
    body[data-state="live"] #status { opacity: 0; }
    body[data-state="error"] #status, body[data-state="stopped"] #status { color: #ff9b9b; }
    #hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px; border-radius: 999px; background: rgb(20 20 22 / 0.82);
      cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.4s;
    }
    body[data-state="live"]:not([data-focused="true"]) #hint { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body data-state="connecting">
  <canvas id="screen" width="1280" height="800" tabindex="0"
    aria-label="Remote desktop — click to control"></canvas>
  <div id="status" role="status" aria-live="polite">Loading…</div>
  <div id="hint">Click to control — keyboard, mouse and sound</div>
  <script type="module">
    import { startViewer } from "./viewer.js";
    startViewer(document);
  </script>
</body>
</html>
